<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>☀️ İzleme</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #eee; padding: 50px; }
        .card { background: white; padding: 30px; display: inline-block; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="durum">Yükleniyor...</h2>
        <div id="veriler"></div>
    </div>
    <script>
        const SB_URL = "https://fpksboxxaxyyinvttamp.supabase.co/rest/v1/panel_verileri?select=*&order=id.desc&limit=1";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwa3Nib3h4YXh5eWludnR0YW1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDk5OTUsImV4cCI6MjA5MDcyNTk5NX0.PRYzjXN8NEFSjee7X9vAgjb1APcKZ2DfH2MGnVgFP4w";

        async function fetchVeri() {
            try {
                const res = await fetch(SB_URL, { headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY }});
                const data = await res.json();
                const d = data[0];
                document.getElementById('durum').innerText = "Durum: " + d.durum;
                document.getElementById('veriler').innerHTML = `<h3>Işık: %${d.isik_seviyesi} | Akım: ${d.uretim_amper}A</h3>`;
            } catch(e) { document.getElementById('durum').innerText = "Hata!"; }
        }
        setInterval(fetchVeri, 3000);
        fetchVeri();
    </script>
</body>
</html>
